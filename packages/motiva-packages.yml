note: >-
  IMPORTANT — these are NOT SDKs, and no `SDKs` pointer is emitted for Motiva.
  Motiva publishes eleven first-party open-source Clojure libraries to Clojars under the
  `motiva` and `ai.motiva` groups, mirrored from github.com/Motiva-AI. Every one is
  internal platform infrastructure the company open-sourced — AWS Step Functions,
  SQS and Kinesis wrappers, logging/debug macros, test helpers — not a client library
  for a Motiva API. Motiva ships no public API, so there is nothing for an SDK to wrap.
  Recording them as `Packages` is accurate; recording them as `SDKs` would credit Motiva
  with a developer-facing client surface it does not have.
  CURRENCY: the whole set is dormant. The newest release is ai.motiva/circleci.test
  (2023-07-22) and the median last-publish year is 2021; five of the eleven have not
  been published since 2021 or earlier. Registries probed with no first-party Motiva
  package found: npm, PyPI, RubyGems, crates.io (npm's `motiva-components` belongs to
  an unrelated author, github.com/thang40/motiva-v2).
