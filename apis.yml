  well-known/motiva-well-known.yml records the /.well-known/ probe across all four
  Motiva hosts but is deliberately NOT wired as type WellKnown or SecurityTxt. The
  only 200 carrying a real document is Intercom's security.txt served on Motiva's
  Intercom-hosted Help Center subdomain (Canonical: app.intercom.com); every other
  200 is an SPA catch-all shell and api.motiva.ai 403s on every path. No Motiva-served
  well-known surface exists, so no pointer is claimed.
