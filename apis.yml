name: Motiva
description: >-
  Motiva AI is an artificial-intelligence layer for enterprise email marketing that
  plugs into Oracle Eloqua and other marketing-automation platforms to automate campaign
  decision-making. It runs multivariate (A/B/n) message testing, patented per-contact
  send-time optimization, frequency management, list and dark-pool cleanup via Smart
  Suppress, audience discovery, and generative-AI email content through Motiva Generator
  (including private-label custom LLMs). Motiva is delivered as an installed connector
  rather than a public developer API, is trusted by enterprises such as Cisco and Thermo
  Fisher, and maintains SOC 1/2/3 and ISO 27001 compliance with GDPR and HIPAA support.
